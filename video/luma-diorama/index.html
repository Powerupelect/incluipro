<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #2a160b;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="diorama" data-composition-id="diorama" data-composition-src="compositions/diorama.html"
        data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <audio id="ambiente" class="clip" src="assets/audio/ambiente.wav" data-start="0" data-duration="8" data-volume="1" data-track-index="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
